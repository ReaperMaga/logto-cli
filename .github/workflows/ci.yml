name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start Logto
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 300
      - name: Integration test
        run: go test -tags integration -count=1 -v ./test/integration/
      - name: Logto logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs logto
      - name: Stop Logto
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build:
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    with:
      version: dev-${{ github.sha }}
