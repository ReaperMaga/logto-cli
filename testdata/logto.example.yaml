# Example spec for `logto-cli apply -f`. ${VAR} is expanded from the environment.
# Sections that are left out are not managed (and never pruned).

roles:
  - name: admin
    description: Administrators
    type: user
    # Scopes of your own API resources, by resource indicator and scope name.
    # scopes:
    #   - resource: https://api.example.com
    #     names: [read, write]
  - name: deployer
    description: CI deployments
    type: m2m

users:
  - username: alice
    email: alice@example.com
    name: Alice
    password: ${ALICE_INITIAL_PASSWORD}   # only used when the user is created
    roles: [admin]
  - username: bob
    suspended: true

apps:
  - name: grafana
    type: traditional
    description: Grafana SSO
    redirectUris: [https://grafana.example.com/login/generic_oauth]
    postLogoutRedirectUris: [https://grafana.example.com/login]
  - name: dashboard
    type: spa
    redirectUris: [https://dash.example.com/callback]
    corsOrigins: [https://dash.example.com]
  - name: ci
    type: m2m
    roles: [deployer]
